    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* Background Video Container */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.55) 100%);
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 0 24px 44px 24px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-bottom: 18px;
            color: rgba(255, 255, 255, 0.95);
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 16px;
            max-width: 340px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 28px;
            max-width: 320px;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 18px;
        }

        .btn {
            flex: 1;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-left {
            background-color: #ffffff;
            color: #111111;
        }

        .btn-right {
            background-color: #e93d66; 
            color: #ffffff;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Teks Dibawah Tombol */
        .footer-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
